{% load i18n %}
<script>
  (function () {
    const showLabel = "{{ _('Show password')|escapejs }}";
    const hideLabel = "{{ _('Hide password')|escapejs }}";
    document.querySelectorAll('[data-toggle-password]').forEach((button) => {
      button.addEventListener('click', () => {
        const input = document.querySelector(button.dataset.togglePassword);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        button.querySelector('i').className = `fa-regular ${show ? 'fa-eye-slash' : 'fa-eye'}`;
        button.setAttribute('aria-label', show ? hideLabel : showLabel);
      });
    });
  })();
</script>
