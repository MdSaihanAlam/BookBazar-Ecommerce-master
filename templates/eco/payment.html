{% extends "eco/base.html" %}

{% block content %}
<style>
  .payment-container {
    max-width: 560px;
    margin: 0 auto;
    padding: 2rem;
  }

  .payment-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: var(--shadow);
  }

  .payment-title {
    text-align: center;
    margin-bottom: 0.5rem;
  }

  .payment-amount {
    text-align: center;
    color: var(--gray);
    margin-bottom: 2rem;
  }

  #stripeBtnLabel {
    display: block;
    font-weight: 500;
    margin-bottom: 0.75rem;
  }

  #card-element {
    background: white;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  #card-errors {
    color: #ef4444;
    min-height: 1.5rem;
    margin-top: 0.5rem;
    font-size: 0.9rem;
  }

  #stripeBtn {
    width: 100%;
    margin-top: 1rem;
    padding: 0.9rem;
    border: none;
    border-radius: 8px;
    background: var(--gradient-primary);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }

  #stripeBtn:disabled {
    opacity: 0.7;
    cursor: wait;
  }

  .payment-note {
    text-align: center;
    color: var(--gray);
    font-size: 0.85rem;
    margin-top: 1rem;
  }
</style>

<div class="payment-container">
  <div class="payment-card">
    <h2 class="payment-title">Payment</h2>
    <p class="payment-amount">Order total: <strong>${{ order_total|floatformat:2 }}</strong></p>

    <form action="" method="post" id="stripe-form">
      {% csrf_token %}
      <label for="card-element" id="stripeBtnLabel">Credit or debit card</label>
      <div id="card-element"></div>
      <div id="card-errors" role="alert"></div>
      <button type="submit" id="stripeBtn">Pay ${{ order_total|floatformat:2 }}</button>
    </form>

    <p class="payment-note">Test mode: use card 4242 4242 4242 4242 with any future date and CVC.</p>
  </div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
  const stripe = Stripe('{{ STRIPE_PUBLIC_KEY }}');
  const card = stripe.elements().create('card', {
    style: {
      base: {
        color: '#32325d',
        fontFamily: '"Helvetica Neue", Helvetica, sans-serif',
        fontSize: '16px',
        '::placeholder': { color: '#aab7c4' }
      },
      invalid: { color: '#fa755a', iconColor: '#fa755a' }
    }
  });
  card.mount('#card-element');

  const errorElement = document.getElementById('card-errors');
  card.on('change', function(event) {
    errorElement.textContent = event.error ? event.error.message : '';
  });

  const form = document.getElementById('stripe-form');
  const payButton = document.getElementById('stripeBtn');
  form.addEventListener('submit', function(event) {
    event.preventDefault();
    payButton.disabled = true;

    stripe.createToken(card).then(function(result) {
      if (result.error) {
        errorElement.textContent = result.error.message;
        payButton.disabled = false;
        return;
      }
      const tokenInput = document.createElement('input');
      tokenInput.type = 'hidden';
      tokenInput.name = 'stripeToken';
      tokenInput.value = result.token.id;
      form.appendChild(tokenInput);
      form.submit();
    });
  });
</script>
{% endblock content %}
